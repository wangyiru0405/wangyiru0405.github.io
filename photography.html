<!DOCTYPE html>
<html lang="zh-CN">

<body>

  <nav class="navbar">
    <div class="nav-brand"><a href="index.html" style="text-decoration:none;color:inherit;">王一如</a></div>
    <p class="nav-motto"><em>由艰难而致高远</em></p>

  <main class="article-container" style="padding-bottom:0;">

      <a class="photo-card" href="photos/album-1.html"

      <!-- 链接卡片：跳转到外部图集 -->
      <a class="photo-card photo-card-link" href="https://example.com/album" target="_blank">

          <h3>专题摄影</h3>
